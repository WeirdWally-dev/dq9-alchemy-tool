name: Build Windows app

# Push a tag like v1.2.0 to build the .exe and publish a GitHub Release.
# Run it by hand from the Actions tab to get a test build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python test_parsers.py

      - name: Check version and get release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python scripts/release_notes.py "${GITHUB_REF_NAME}" > notes.md

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name DQ9-Alchemy-Helper
          --add-data "sheet_recipes.json;."
          --add-data "shops_bundled.json;."
          dq9_alchemy_helper.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DQ9-Alchemy-Helper
          path: dist/DQ9-Alchemy-Helper.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If the release was already made on GitHub's website, attach the exe to it instead.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/DQ9-Alchemy-Helper.exe --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" dist/DQ9-Alchemy-Helper.exe \
              --title "DQ9 Alchemy Helper ${GITHUB_REF_NAME}" --notes-file notes.md
          fi
