name: Build Android app

# Every push to main runs the tests and builds an APK (download it from the run's Artifacts).
# If a GitHub Release named v<VERSION from CMakeLists.txt> exists, the APK is attached to it, so
# making the release on the website is enough. Pushing a version tag (v1.4.0) also publishes it.
on:
  push:
    branches: ["main", "android-cpp"]
    tags: ["v*", "android-v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"
  NDK_VERSION: "26.1.10909125"   # the NDK Qt 6.8 is built and tested with

jobs:
  test:
    name: Tests (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/dq9_tests

  android:
    name: APK (arm64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # Qt for Android needs a desktop Qt of the same version for its build tools.
      - name: Install Qt (desktop host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          set-env: false

      - name: Install Qt (Android arm64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os   # Qt 6.7+ publishes the Android kits under all_os
          target: android
          arch: android_arm64_v8a
          cache: true

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$RUNNER_WORKSPACE/Qt/${QT_VERSION}/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DDQ9_BUILD_TESTS=OFF

      - name: Build APK
        run: cmake --build build-android --target apk

      # Sign with your own key when the repo has one (Settings > Secrets > Actions:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS), so updates install
      # over the previous version. Without it a throwaway key is used: fine for trying it out, but
      # each build then has to be uninstalled before the next one installs.
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          unsigned=$(find build-android -name "*-unsigned.apk" | head -n1)
          if [ -z "$unsigned" ]; then unsigned=$(find build-android -name "*.apk" | head -n1); fi
          echo "Built: $unsigned"
          tools="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            pass="$KEYSTORE_PASS"; alias="$KEY_ALIAS"
          else
            echo "::warning::No signing key in the repo secrets; signing with a throwaway key."
            pass=throwaway; alias=dq9
            keytool -genkeypair -keystore release.jks -storepass "$pass" -keypass "$pass" -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DQ9 Alchemy Helper" > /dev/null
          fi
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks release.jks --ks-pass "pass:$pass" --ks-key-alias "$alias" \
            --out DQ9-Alchemy-Helper.apk aligned.apk
          "$tools/apksigner" verify DQ9-Alchemy-Helper.apk
          rm -f release.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DQ9-Alchemy-Helper-apk
          path: DQ9-Alchemy-Helper.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code_version=$(sed -nE 's/^project\(DQ9AlchemyHelper VERSION ([0-9.]+) .*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#android-}"; version="${version#v}"
            [ "$version" = "$code_version" ] || { echo "Tag $tag doesn't match VERSION $code_version in CMakeLists.txt"; exit 1; }
          else
            # A branch push: only attach to a release that already exists for this version.
            tag="v$code_version"; version="$code_version"
            gh release view "$tag" > /dev/null 2>&1 || { echo "No release $tag yet; the APK is in this run's Artifacts."; exit 0; }
          fi
          awk -v v="$version" '/^## /{if(found)exit; found=($2==v)} found && !/^## /' CHANGELOG.md > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" DQ9-Alchemy-Helper.apk --clobber
            [ -s notes.md ] && gh release edit "$tag" --notes-file notes.md
          else
            [ -s notes.md ] || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
            gh release create "$tag" DQ9-Alchemy-Helper.apk --title "DQ9 Alchemy Helper $version" --notes-file notes.md
          fi
          echo "Attached DQ9-Alchemy-Helper.apk to release $tag"
